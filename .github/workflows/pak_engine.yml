name: PAK and Lua Tool Engine

on:
  push:
    paths-ignore:
      - 'unpack_folder/**'
      - 'repack_folder/**'
      - '.git/**'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Operation to perform'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - unpack
          - repack

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup QEMU & ARM64 Binfmt (Termux Binary Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support rustc cargo binutils build-essential
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Termux Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install rich colorama termcolor pyfiglet requests pycryptodome zstandard gmalg cryptography

      - name: 🛠️ Link Termux LD_LIBRARY_PATH & Organize Folders
        run: |
          # Termux library directory simulate karein
          sudo mkdir -p /data/data/com.termux/files/usr/lib
          sudo mkdir -p /data/data/com.termux/files/usr/bin
          sudo ln -sf /usr/lib/x86_64-linux-gnu/* /data/data/com.termux/files/usr/lib/ 2>/dev/null || true
          sudo ln -sf /usr/lib/* /data/data/com.termux/files/usr/lib/ 2>/dev/null || true
          sudo ln -sf /usr/local/lib/* /data/data/com.termux/files/usr/lib/ 2>/dev/null || true
          sudo ln -sf $(which python3) /data/data/com.termux/files/usr/bin/python
          sudo ln -sf $(which python3) /data/data/com.termux/files/usr/bin/python3

          # Toxic 4.5 tool ke andar se const aur sm4_variant root me copy karein
          if [ -d "Toxic 4.5 tool" ]; then
            echo "Syncing files from 'Toxic 4.5 tool'..."
            cp -rn "Toxic 4.5 tool/"* . 2>/dev/null || true
          fi

          # Binaries ko execute permission dein
          chmod +x *.bin 2>/dev/null || true
          chmod -R 777 .

      - name: 🚀 Execute Unpack / Repack Engine with Key
        env:
          LD_LIBRARY_PATH: /data/data/com.termux/files/usr/lib
          INPUT_ACTION_TYPE: ${{ github.event.inputs.action_type || 'auto' }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import glob
          import json
          import subprocess
          import time

          # 1. Structure folders ensure karein
          for d in ['original_pak', 'unpack_folder', 'repack_folder']:
              os.makedirs(d, exist_ok=True)
              kf = os.path.join(d, '.gitkeep')
              if not os.path.exists(kf):
                  open(kf, 'w').close()

          # 2. data.json check & parse
          data_file = 'data.json'
          if not os.path.exists(data_file):
              default_cfg = {
                  "unpack": True,
                  "repack": False,
                  "key": "HR-RAJPUT",
                  "pak_name": "game.pak"
              }
              with open(data_file, 'w', encoding='utf-8') as f:
                  json.dump(default_cfg, f, indent=4)
              config = default_cfg
          else:
              with open(data_file, 'r', encoding='utf-8') as f:
                  config = json.load(f)

          # Manual dispatch handling
          action_env = os.getenv("INPUT_ACTION_TYPE", "auto")
          if action_env == "unpack":
              config["unpack"] = True
              config["repack"] = False
          elif action_env == "repack":
              config["unpack"] = False
              config["repack"] = True

          KEY = config.get("key", "HR-RAJPUT")

          # 3. Binaries locate karein
          all_files = os.listdir('.')
          main_bin = None
          lua_bin = None

          for f in all_files:
              if f.endswith('.bin') and 'TOXIC' in f:
                  if 'Lua' in f or 'LUA' in f:
                      lua_bin = f
                  else:
                      main_bin = f

          print(f"🔑 License Key: {KEY}")
          print(f"📦 Main Binary: {main_bin}")
          print(f"📜 Lua Binary:  {lua_bin}")

          if not main_bin and not lua_bin:
              print("❌ Koi TOXIC .bin file nahi mili!")
              sys.exit(1)

          def run_binary(bin_name, inputs_list):
              if not bin_name or not os.path.exists(bin_name):
                  return
              os.chmod(bin_name, 0o777)
              cmd = [f"./{bin_name}"]
              input_str = "\n".join(inputs_list) + "\n\n"
              
              env = os.environ.copy()
              env["LD_LIBRARY_PATH"] = f"/data/data/com.termux/files/usr/lib:{env.get('LD_LIBRARY_PATH', '')}"

              print(f"\n▶️ Running: {bin_name}")
              try:
                  proc = subprocess.Popen(
                      cmd,
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      env=env
                  )
                  stdout, _ = proc.communicate(input=input_str, timeout=900)
                  print(stdout)
              except Exception as e:
                  print(f"⚠️ Direct ELF execution fallback to python ({e}):")
                  proc = subprocess.Popen(
                      [sys.executable, bin_name],
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      env=env
                  )
                  stdout, _ = proc.communicate(input=input_str, timeout=900)
                  print(stdout)

          # 4. Unpack Process
          if config.get("unpack"):
              print("\n==========================================")
              print("🚀 STARTING UNPACK PROCESS")
              print("==========================================")
              
              paks = glob.glob("original_pak/*.pak") + glob.glob("original_pak/*.PAK")
              if not paks:
                  print("⚠️ 'original_pak/' folder me koi .pak file nahi hai! Kripya .pak file upload karein.")
              else:
                  target_pak = paks[0]
                  print(f"🎯 Selected PAK: {target_pak}")
                  
                  # 1st: Main Tool unpack run karega (Key -> Option 1 -> Target Pak -> unpack_folder)
                  if main_bin:
                      print("🔹 Running Main PAK Tool...")
                      run_binary(main_bin, [KEY, "1", target_pak, "unpack_folder"])

                  # 2nd: Lua Tool decrypt karega
                  if lua_bin:
                      print("🔹 Running Lua Tool on unpacked assets...")
                      run_binary(lua_bin, [KEY, "1", "unpack_folder"])

                  print("✅ Unpack successfully completed!")

          # 5. Repack Process
          elif config.get("repack"):
              print("\n==========================================")
              print("🚀 STARTING REPACK PROCESS")
              print("==========================================")
              
              output_name = config.get("pak_name", "game.pak")
              if not output_name.endswith(".pak"):
                  output_name += ".pak"
              output_pak = os.path.join("repack_folder", output_name)

              # 1st: Lua Tool encrypt/build karega
              if lua_bin:
                  print("🔹 Encrypting Lua assets...")
                  run_binary(lua_bin, [KEY, "2", "unpack_folder"])

              # 2nd: Main Tool repack karega nayi PAK me (Key -> Option 2 -> unpack_folder -> output_pak)
              if main_bin:
                  print(f"🔹 Building PAK: {output_pak}...")
                  run_binary(main_bin, [KEY, "2", "unpack_folder", output_pak])

              print("✅ Repack successfully completed!")
          EOF

      - name: 📤 Upload Processed PAK & Folders as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-output
          path: |
            unpack_folder/
            repack_folder/
          retention-days: 7

      - name: 💾 Commit & Auto Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Root ke folder updates aur outputs add karein
          git add data.json original_pak/ unpack_folder/ repack_folder/
          
          if git diff --staged --quiet; then
            echo "Koi naya badlaav nahi hai commit karne ke liye."
          else
            git commit -m "Auto: Update PAK extracted/repacked data [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
