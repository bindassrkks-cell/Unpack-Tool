name: Automated PAK Tool Engine

on:
  push:
    paths-ignore:
      - 'unpack_folder/**'
      - 'repack_folder/**'
      - '.git/**'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Operation (auto reads data.json)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - unpack
          - repack

permissions:
  contents: write

jobs:
  pak-process:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup QEMU (ARM64 Termux Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support rustc cargo binutils build-essential

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install All Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install rich colorama termcolor pyfiglet requests pycryptodome zstandard gmalg cryptography

      - name: 🚀 Run Tool & Auto-Manage Folders
        env:
          INPUT_ACTION_TYPE: ${{ github.event.inputs.action_type || 'auto' }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import glob
          import json
          import subprocess

          # 1. Structure Folders Auto-Create
          folders = ['original_pak', 'unpack_folder', 'repack_folder']
          for folder in folders:
            os.makedirs(folder, exist_ok=True)
            keep_file = os.path.join(folder, '.gitkeep')
            if not os.path.exists(keep_file):
              with open(keep_file, 'w') as kf:
                pass

          # 2. data.json Auto-Create if missing
          data_file = 'data.json'
          if not os.path.exists(data_file):
            default_config = {
              "unpack": True,
              "repack": False,
              "pak_name": "game.pak"
            }
            with open(data_file, 'w', encoding='utf-8') as df:
              json.dump(default_config, df, indent=4)
            print("✨ Created default data.json")

          with open(data_file, 'r', encoding='utf-8') as df:
            config = json.load(df)

          # Manual dispatch check
          action_env = os.getenv("INPUT_ACTION_TYPE", "auto")
          if action_env == "unpack":
            config["unpack"] = True
            config["repack"] = False
          elif action_env == "repack":
            config["unpack"] = False
            config["repack"] = True

          # 3. Locate Tool Binary
          bin_files = [f for f in os.listdir('.') if 'TOXIC' in f and f.endswith('.bin')]
          if not bin_files:
            print("❌ Koi TOXIC .bin file nahi mili!")
            sys.exit(0)

          tool_bin = None
          for f in bin_files:
            if "4.5" in f and "Lua" not in f:
              tool_bin = f
              break
          if not tool_bin:
            tool_bin = bin_files[0]

          print(f"🔧 Found Tool Binary: {tool_bin}")
          os.chmod(tool_bin, 0o777)

          def execute_tool(input_data):
            is_elf = False
            try:
              with open(tool_bin, 'rb') as tf:
                if tf.read(4) == b'\x7fELF':
                  is_elf = True
            except Exception:
              pass

            cmd = [f"./{tool_bin}"] if is_elf else [sys.executable, tool_bin]
            print(f"Running: {' '.join(cmd)}")
            try:
              proc = subprocess.Popen(
                cmd,
                stdin=subprocess.PIPE,
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                text=True
              )
              out, _ = proc.communicate(input=input_data, timeout=1200)
              print(out)
            except Exception as e:
              print(f"Error executing directly: {e}, trying fallback via Python...")
              proc = subprocess.Popen(
                [sys.executable, tool_bin],
                stdin=subprocess.PIPE,
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                text=True
              )
              out, _ = proc.communicate(input=input_data, timeout=1200)
              print(out)

          # 4. Handle Unpack Mode
          if config.get("unpack"):
            print("\n======================================")
            print("🚀 OPERATION: UNPACK")
            print("======================================")
            paks = glob.glob("original_pak/*.pak") + glob.glob("original_pak/*.PAK")
            if not paks:
              print("⚠️ 'original_pak/' me koi .pak file nahi hai. Apni .pak file upload karein.")
              readme_file = os.path.join("original_pak", "README.md")
              if not os.path.exists(readme_file):
                with open(readme_file, "w") as rf:
                  rf.write("Yahan original .pak file dalein.\n")
            else:
              target_pak = paks[0]
              print(f"🎯 Target PAK: {target_pak}")
              # Inputs: [Option 1 for unpack] -> [Pak path] -> [Output dir]
              inputs = f"1\n{target_pak}\nunpack_folder\n\n\n"
              execute_tool(inputs)
              print("✅ Unpack execution complete.")

          # 5. Handle Repack Mode
          elif config.get("repack"):
            print("\n======================================")
            print("🚀 OPERATION: REPACK")
            print("======================================")
            output_name = config.get("pak_name", "repacked_game.pak")
            if not output_name.endswith(".pak"):
              output_name += ".pak"
            output_pak = os.path.join("repack_folder", output_name)
            print(f"🎯 Output Target: {output_pak}")
            # Inputs: [Option 2 for repack] -> [Input dir] -> [Output pak path]
            inputs = f"2\nunpack_folder\n{output_pak}\n\n\n"
            execute_tool(inputs)
            print("✅ Repack execution complete.")

          else:
            print("ℹ️ data.json me unpack aur repack dono false hain.")
          EOF

      - name: 📤 Upload Output as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-pak-files
          path: |
            unpack_folder/
            repack_folder/
          retention-days: 7

      - name: 💾 Auto Push Folders & Results to GitHub Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json original_pak/ unpack_folder/ repack_folder/
          
          if git diff --staged --quiet; then
            echo "Koi nayi files ya changes nahi hain commit karne ke liye."
          else
            git commit -m "Auto: Update PAK structure and files [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
